name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify tag matches VERSION
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os, pathlib, sys; version=pathlib.Path('VERSION').read_text().strip(); sys.exit(0 if os.environ['RELEASE_TAG'] == f'v{version}' else 1)"

      - name: Verify and test
        run: |
          python scripts/doctor.py --project-only
          python -m unittest discover -s tests -v
          node --check assets/dashboard/i18n.js
          node --check assets/dashboard/app.js

      - name: Build release package
        run: python scripts/package_release.py --output-dir dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.zip
