name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run project doctor
        run: python scripts/doctor.py --project-only

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Check dashboard JavaScript
        run: |
          node --check assets/dashboard/i18n.js
          node --check assets/dashboard/app.js

      - name: Build installable Skill package
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python scripts/package_release.py --output-dir dist

      - name: Upload installable Skill package
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: skill-package-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
